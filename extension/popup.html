<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneFill AutoFill</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 320px;
      background: #FDF6E3;
      color: #2B2520;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #EADFC7;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge {
      background: #4F46E5;
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #059669;
    }
    .profile-card {
      background: #FFFFFF;
      border: 1px solid #EADFC7;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(90, 75, 45, 0.05);
    }
    .profile-name {
      font-size: 13px;
      font-weight: 700;
      color: #2B2520;
      margin-bottom: 2px;
    }
    .profile-meta {
      font-size: 11px;
      color: #685E53;
      margin-bottom: 8px;
    }
    .badge-count {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      background: rgba(79, 70, 229, 0.1);
      color: #4F46E5;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .btn-primary {
      width: 100%;
      background: #4F46E5;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
      transition: background 0.15s ease;
    }
    .btn-primary:hover {
      background: #4338CA;
    }
    .btn-secondary {
      width: 100%;
      background: #FFFFFF;
      border: 1px solid #EADFC7;
      color: #685E53;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-secondary:hover {
      background: #FAF5E8;
    }
    .footer-note {
      font-size: 10.5px;
      color: #8F8474;
      text-align: center;
      margin-top: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="logo-badge">OneFill</span>
      <span class="title">AI AutoFill</span>
    </div>
    <div class="status-dot" id="server-status" title="Connected to Local OneFill Server"></div>
  </div>

  <div class="profile-card" id="profile-container">
    <div class="profile-name" id="user-name">Loading Profile...</div>
    <div class="profile-meta" id="user-email">Checking local server connection...</div>
    <span class="badge-count" id="fields-count">0 Fields Saved</span>
  </div>

  <button type="button" class="btn-primary" id="btn-autofill-page">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
    Scan &amp; AutoFill Page
  </button>

  <button type="button" class="btn-secondary" id="btn-open-dashboard">
    Open OneFill Dashboard
  </button>

  <div class="footer-note">
    Strict Permission Required &bull; No Auto-Submit &bull; AES-256 Encrypted
  </div>

  <script src="popup.js"></script>
</body>
</html>
